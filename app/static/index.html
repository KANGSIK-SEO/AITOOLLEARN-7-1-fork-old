<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명화 찾기 챗봇</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div>🖼️ 퍼블릭 도메인 명화 찾기</div>
            <div class="status-bar" id="status-bar">로그인이 필요합니다</div>
            <button id="logout-btn" class="link-btn" hidden>로그아웃</button>
        </header>

        <section id="auth-panel" class="auth-panel">
            <p class="hint">상업적으로 써도 되는 CC0 명화를 한국어로 물어보세요.<br>(MET · Art Institute of Chicago 공개 데이터)</p>
            <input type="email" id="email" placeholder="이메일" autocomplete="username">
            <input type="password" id="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password">
            <div class="auth-buttons">
                <button id="login-btn" class="pill">로그인</button>
                <button id="signup-btn" class="pill secondary">회원가입</button>
            </div>
            <div id="auth-error" class="error-text" role="alert"></div>
        </section>

        <section id="chat-panel" hidden>
            <div id="chat-log" class="chat-log">
                <div class="message bot">안녕하세요! 어떤 명화를 찾으세요?<br>예) "봄 느낌 풍경화 보여줘", "모네 작품 중 물이 나오는 그림"</div>
            </div>
            <form id="chat-form" class="input-area">
                <input type="text" id="message-input" maxlength="500" placeholder="질문을 입력하세요 (최대 500자)" autocomplete="off">
                <button id="send-btn" type="submit" title="보내기">➤</button>
            </form>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
